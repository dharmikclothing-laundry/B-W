services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]
volumes:
  redis-data:
