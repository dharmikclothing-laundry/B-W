name: Deploy
on:
  push:
    branches: [main, staging]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bright-white-api:${{ github.sha }}
      # Production deployment should authenticate to the chosen registry and platform
      # using GitHub Environments: staging / production.
